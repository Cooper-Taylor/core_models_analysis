name: ci

# The unit tests deliberately need no external data: they cover input
# resolution, operator normalisation and stage selection, which is where the
# defects were. Anything needing ModelSEEDDatabase or the model JSONs is out of
# scope for CI and is covered by scripts/check_goldens.py, run locally.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import weight
        # cma must stay cheap to import: site/serve.py is stdlib-only by design.
        run: |
          python -c "
          import sys, cma
          from cma import paths, sources, variants, models, directions
          heavy = [m for m in ('cobra','pandas','numpy','matplotlib') if m in sys.modules]
          assert not heavy, f'importing cma pulled in {heavy}'
          print('import weight ok')"
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check scripts/cma tests
